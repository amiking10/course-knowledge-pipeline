[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "course-knowledge-pipeline"
version = "0.4.0"
requires-python = ">=3.11"
description = "Provenance-preserving lecture ingestion, parsing, search and ChatGPT export"
dependencies = []

[project.optional-dependencies]
parse = ["docling>=2.50,<3"]
inspect = ["PyMuPDF>=1.24"]
retrieval = ["scikit-learn>=1.4"]
vision = ["openai>=1.0"]
semantic = ["numpy>=1.24", "sentence-transformers>=3"]
dev = ["pytest>=8", "PyMuPDF>=1.24"]

[project.scripts]
course-pipeline = "course_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
