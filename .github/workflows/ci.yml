name: Tests
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  push:
  pull_request:
jobs:
  pytest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[inspect,retrieval,dev]"
      - run: python -m pytest -q
      - name: Validate PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content -Raw scripts/run_pipeline.ps1))
          [void][scriptblock]::Create((Get-Content -Raw scripts/setup_windows.ps1))
          $launcherAst = [scriptblock]::Create((Get-Content -Raw scripts/launcher_windows.ps1))
          if (-not (Test-Path START_UNIVERSE.cmd)) { throw 'Missing Windows launcher' }
          if (-not ((Get-Content -Raw START_UNIVERSE.cmd) -match 'powershell.exe -NoProfile -STA -ExecutionPolicy RemoteSigned -File')) { throw 'Launcher must use Windows PowerShell STA' }
          $params = (Get-Command ./scripts/run_pipeline.ps1).Parameters
          if (-not $params.ContainsKey('DatabasePath')) { throw 'Expected DatabasePath parameter' }
          if (-not $params.ContainsKey('WithVisualPDF')) { throw 'Expected WithVisualPDF parameter' }
          if (-not (Test-Path src/course_pipeline/project_instructions.py)) { throw 'Missing single Project Instructions generator' }
          [void][scriptblock]::Create((Get-Content -Raw scripts/register_daily_update.ps1))
          [void][scriptblock]::Create((Get-Content -Raw scripts/upgrade_v03_export.ps1))
  docling-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[parse,inspect,dev]"
      - run: python -m pytest -q tests/test_docling_smoke.py

  docling-windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[parse,inspect,dev]"
      - run: python -m pytest -q tests/test_docling_smoke.py
